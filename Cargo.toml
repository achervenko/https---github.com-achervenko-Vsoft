[package]
name = "vsoft"
version = "0.1.0"
edition = "2021"

[dependencies]
acadrust = { version = "=0.6.8", default-features = false }
lopdf = { version = "=0.34.0", default-features = false, features = ["nom_parser"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
mupdf = { version = "=0.8.0", default-features = false, features = ["base14-fonts"] }
ttf-parser = "=0.25.1"
